# ============================================================
#  座椅联合图书馆 - nginx 反向代理配置（Termux）
#
#  监听 8080（Termux 非 root 无法绑定 80/443），
#  将所有请求反向代理到本机 Node 后端 127.0.0.1:3000。
#  后端 app.js 已托管前端构建产物、/uploads 静态文件与 /api 接口，
#  因此这里用单一 location 转发即可。
# ============================================================

worker_processes  1;

events {
    worker_connections  256;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ---- gzip 压缩 ----
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json
                      application/javascript application/xml+rss
                      application/xml text/xml text/javascript image/svg+xml;

    # 与后端 50MB 上传上限保持一致
    client_max_body_size 50m;

    # ---- 反向代理到 Node（127.0.0.1:3000）----
    server {
        listen       8080;
        server_name  localhost;

        location / {
            proxy_pass          http://127.0.0.1:3000;
            proxy_http_version  1.1;

            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    X-Forwarded-Host  $host;
            proxy_set_header    X-Forwarded-Port  $server_port;

            proxy_connect_timeout  60s;
            proxy_read_timeout     60s;
            proxy_send_timeout     60s;
        }
    }
}
